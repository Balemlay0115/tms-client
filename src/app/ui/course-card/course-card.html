<div class="card">
  <div class="card-header">
    <span class="course-code">{{ course().code }}</span>
    <span
      class="badge"
      [class.closed]="course().enrollmentCount >= course().maxCapacity"
    >
      {{ course().enrollmentCount >= course().maxCapacity ? "Full" : "Accepting enrollments" }}
    </span>
  </div>

  <div class="card-body">
    <h3 class="card-title">
      <a [routerLink]="['/courses', course().id]">{{ course().title }}</a>
    </h3>

    <div class="capacity-info">
      <div class="capacity-text">
        <span>Enrolled</span>
        <strong>{{ course().enrollmentCount }} / {{ course().maxCapacity }} seats</strong>
      </div>

      <!-- Enrollment progress bar -->
      <div class="progress-bar">
        <div
          class="progress-fill"
          [style.width.%]="(course().enrollmentCount / course().maxCapacity) * 100"
          [class.full]="course().enrollmentCount >= course().maxCapacity"
        ></div>
      </div>
    </div>
  </div>

  <div class="card-footer">
    <button
      class="btn-enroll"
      (click)="enrollClicked.emit(course())"
      [disabled]="course().enrollmentCount >= course().maxCapacity"
    >
      Enroll
    </button>
  </div>
</div>
