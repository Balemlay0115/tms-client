<h2>Enrollment Records</h2>
@if (store.isLoading()) {
  <p>Loading enrollments...</p>
}
@if (store.error()) {
  <p class="error">{{ store.error() }}</p>
}
<table mat-table [dataSource]="dataSource" matSort class="mat-elevation-z8">
  <!-- Student Name Column -->
  <ng-container matColumnDef="studentName">
    <th mat-header-cell *matHeaderCellDef mat-sort-header>Student</th>
    <td mat-cell *matCellDef="let row">{{ row.studentName }}</td>
  </ng-container>
  <!-- Course Name Column -->
  <ng-container matColumnDef="courseName">
    <th mat-header-cell *matHeaderCellDef mat-sort-header>Course</th>
    <td mat-cell *matCellDef="let row">{{ row.courseName }}</td>
  </ng-container>
  <!-- Status Column -->
  <ng-container matColumnDef="status">
    <th mat-header-cell *matHeaderCellDef mat-sort-header>Status</th>
    <td mat-cell *matCellDef="let row">
      <span class="status-badge" [class]="row.status.toLowerCase()">
        {{ row.status }}
      </span>
    </td>
  </ng-container>
  <!-- Actions Column -->
  <ng-container matColumnDef="actions">
    <th mat-header-cell *matHeaderCellDef>Actions</th>
    <td mat-cell *matCellDef="let row">
      @if (row.status === 'Pending') {
        <button (click)="store.approveEnrollment(row.id)">Approve</button>
      }
    </td>
  </ng-container>
  <!-- Row definitions -->
  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
</table>
<mat-paginator [pageSizeOptions]="[10, 25, 50]" showFirstLastButtons> </mat-paginator>
